[project]
name = "gcp-event-pipeline-processor"
version = "0.1.0"
description = "Cloud Function that validates raw order events and writes curated, partitioned JSONL"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # functions-framework still calls datetime.utcnow() when converting Pub/Sub push bodies.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:functions_framework",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
